services:
  app:
    image: maritvanwees-nl:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:8080'
    environment:
      NODE_ENV: production
      # public runtime config consumed by nuxt at request time.
      # add NUXT_PUBLIC_* entries here as runtimeConfig.public grows.
      NUXT_PUBLIC_SITE_URL: https://maritvanwees.nl
