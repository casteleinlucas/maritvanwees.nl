name: CI Analyze

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

'on':
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # vue-tsc was already a dependency but nothing ran it, so a broken prop type or a typo in an
      # icon name only surfaced at build time. `nuxt prepare` first — the generated .nuxt/ types are
      # what make auto-imported composables and components resolvable.
      - name: Check types
        run: npm run typecheck

      # lint and types don't catch a broken prerender or a font download that fails; that only
      # showed at the deploy. build here, start the server and check the routes that matter
      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          PORT=3010 node .output/server/index.mjs &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3010/ > /dev/null && break; sleep 1; done
          status() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3010$1"; }
          test "$(status /)" = 200
          test "$(status /robots.txt)" = 200
          test "$(status /sitemap.xml)" = 200
          test "$(status /bestaat-niet)" = 404
          curl -sI http://127.0.0.1:3010/ | grep -qi '^content-security-policy:'
          curl -sI http://127.0.0.1:3010/ | grep -qi '^strict-transport-security:'
