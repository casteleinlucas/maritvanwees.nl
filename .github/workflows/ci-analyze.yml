name: CI Analyze

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

'on':
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      # vue-tsc was already a dependency but nothing ran it, so a broken prop type or a typo in an
      # icon name only surfaced at build time. `nuxt prepare` first — the generated .nuxt/ types are
      # what make auto-imported composables and components resolvable.
      - name: Check types
        run: npm run typecheck
